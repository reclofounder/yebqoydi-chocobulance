<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 450" preserveAspectRatio="xMinYMax slice" class="scene__art layer-far" aria-hidden="true" focusable="false">
  <!-- Road scene, far layer: the distant skyline, 1600x450, laid out at twice the stage's width
       (scenes.css) so the timeline can slide it left by up to half its width. Phones only ever
       see x 0-720, so the landmarks sit there: the TV tower and Hotel Uzbekistan's lattice slab (clear of the
       middle layer's Chorsu dome).
       One soft tone (group opacity), so it reads as distance on a dawn or a day sky. Tokens only. -->
  <defs>
    <pattern id="road-far-lattice" width="12" height="15" patternUnits="userSpaceOnUse">
      <path d="M3 15V7.5a3 3 0 0 1 6 0V15" style="fill: none; stroke: var(--cream); stroke-width: 2" />
    </pattern>
    <pattern id="road-far-windows" width="18" height="20" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="8" height="8" rx="2" style="fill: var(--cream)" />
    </pattern>
  </defs>
  <g style="opacity: 0.5">
    <g style="fill: var(--hazel)">
      <!-- blocks of flats -->
      <rect x="-10" y="232" width="110" height="140" rx="4" />
      <rect x="270" y="210" width="96" height="162" rx="4" />
      <rect x="400" y="226" width="110" height="146" rx="4" />
      <rect x="820" y="200" width="90" height="172" rx="4" />
      <rect x="1180" y="226" width="120" height="146" rx="4" />
      <rect x="1460" y="214" width="150" height="158" rx="4" />
      <!-- TV tower: three splayed legs, shaft, two decks, spire -->
      <path d="M150 372L184 262H200L234 372H218L192 282L166 372Z" />
      <path d="M184 262L188 96H196L200 262Z" />
      <ellipse cx="192" cy="116" rx="24" ry="10" />
      <ellipse cx="192" cy="136" rx="15" ry="6" />
      <rect x="190" y="10" width="4" height="90" rx="2" />
      <rect x="185" y="62" width="14" height="5" rx="2.5" />
      <rect x="186" y="38" width="12" height="4" rx="2" />
      <!-- Hotel Uzbekistan: a wide slab with a concave crown -->
      <path d="M592 372V156Q672 140 752 156V372Z" />
      <!-- Tashkent City towers and a minaret (desktop only) -->
      <path d="M1000 372V138Q1000 120 1020 120Q1040 120 1040 138V372Z" />
      <path d="M1060 372V170Q1060 152 1080 152Q1100 152 1100 170V372Z" />
      <rect x="1384" y="150" width="20" height="222" rx="4" />
      <path d="M1378 160H1410L1394 120Z" />
      <rect x="1380" y="200" width="28" height="8" rx="4" />
    </g>
    <rect x="604" y="168" width="136" height="204" style="fill: url(#road-far-lattice)" />
    <g style="fill: url(#road-far-windows)">
      <rect x="-6" y="238" width="102" height="134" />
      <rect x="274" y="216" width="88" height="156" />
      <rect x="404" y="232" width="102" height="140" />
      <rect x="826" y="206" width="78" height="166" />
      <rect x="1186" y="232" width="108" height="140" />
      <rect x="1466" y="220" width="138" height="152" />
    </g>
  </g>
</svg>
