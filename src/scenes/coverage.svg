<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" aria-hidden="true" focusable="false">
  <!-- Coverage map, 480x360. Painted with the design tokens (inline SVG sees the page's custom
       properties). No <text>: the readable labels are HTML elements positioned over this art. -->

  <!-- Outside the city: the grey panel the ring sits on -->
  <rect width="480" height="360" rx="28" style="fill: var(--grey-out)" />
  <g style="fill: var(--choco); fill-opacity: 0.06">
    <rect x="14" y="16" width="64" height="44" rx="10" />
    <rect x="404" y="22" width="62" height="50" rx="10" />
    <rect x="428" y="196" width="40" height="60" rx="10" />
  </g>
  <!-- Roads that leave the ring -->
  <g
    style="
      fill: none;
      stroke: var(--choco);
      stroke-opacity: 0.12;
      stroke-width: 6;
      stroke-linecap: round;
    "
  >
    <path d="M396 142 C 430 140 456 146 480 148" />
    <path d="M84 136 C 54 134 24 130 0 128" />
    <path d="M238 236 C 240 280 252 320 262 360" />
  </g>

  <!-- Inside the city: cream base, then the red 12% tint and the ring-road outline -->
  <path
    d="M236 42 C 326 34 400 78 396 142 C 392 206 328 240 238 236 C 146 232 80 200 84 136 C 88 76 150 48 236 42 Z"
    style="fill: var(--cream)"
  />
  <path
    d="M236 42 C 326 34 400 78 396 142 C 392 206 328 240 238 236 C 146 232 80 200 84 136 C 88 76 150 48 236 42 Z"
    style="
      fill: var(--red);
      fill-opacity: 0.12;
      stroke: var(--red);
      stroke-width: 4;
      stroke-linejoin: round;
    "
  />
  <!-- Inner ring and a few streets -->
  <path
    d="M236 42 C 326 34 400 78 396 142 C 392 206 328 240 238 236 C 146 232 80 200 84 136 C 88 76 150 48 236 42 Z"
    transform="translate(240 139) scale(0.74) translate(-240 -139)"
    vector-effect="non-scaling-stroke"
    style="
      fill: none;
      stroke: var(--red);
      stroke-opacity: 0.35;
      stroke-width: 2;
      stroke-dasharray: 2 7;
      stroke-linecap: round;
    "
  />
  <g
    style="
      fill: none;
      stroke: var(--red);
      stroke-opacity: 0.2;
      stroke-width: 3;
      stroke-linecap: round;
    "
  >
    <path d="M104 100 C 176 128 300 160 376 124" />
    <path d="M112 190 C 190 166 290 174 368 200" />
    <path d="M238 46 C 230 104 252 172 240 232" />
  </g>

  <!-- Chocobulance inside: the van with speed lines (the label sits just below, in HTML) -->
  <g style="stroke: var(--red); stroke-opacity: 0.55; stroke-width: 4; stroke-linecap: round">
    <path d="M150 104 H168" />
    <path d="M140 118 H166" />
    <path d="M152 132 H168" />
  </g>
  <g transform="translate(176 80) scale(1.3)">
    <ellipse cx="48" cy="50" rx="42" ry="3.5" style="fill: var(--choco); fill-opacity: 0.18" />
    <g style="stroke: var(--choco); stroke-width: 2.5; stroke-linejoin: round">
      <rect x="2" y="8" width="62" height="34" rx="6" style="fill: var(--white)" />
      <path d="M64 18 H80 Q86 18 88 24 L94 33 V42 H64 Z" style="fill: var(--white)" />
    </g>
    <path d="M69 22 H79 Q82 22 83.5 25.5 L87 32 H69 Z" style="fill: var(--sky-day-top)" />
    <rect x="3.25" y="28" width="60.5" height="7" style="fill: var(--red)" />
    <path
      d="M24 12 V24 M18 18 H30"
      style="fill: none; stroke: var(--red); stroke-width: 4.5; stroke-linecap: round"
    />
    <rect
      x="30"
      y="2"
      width="14"
      height="7"
      rx="2.5"
      style="fill: var(--red); stroke: var(--choco); stroke-width: 2"
    />
    <g style="fill: var(--choco)">
      <circle cx="22" cy="43" r="7.5" />
      <circle cx="76" cy="43" r="7.5" />
    </g>
    <g style="fill: var(--white)">
      <circle cx="22" cy="43" r="2.8" />
      <circle cx="76" cy="43" r="2.8" />
    </g>
  </g>

  <!-- Chocobulance outside: a grey van, with a crossed circle (not coming here) -->
  <g transform="translate(372 298) scale(0.9)" style="fill: var(--choco); fill-opacity: 0.28">
    <ellipse cx="48" cy="50" rx="42" ry="3.5" style="fill-opacity: 0.12" />
    <rect x="2" y="8" width="62" height="34" rx="6" />
    <path d="M64 18 H80 Q86 18 88 24 L94 33 V42 H64 Z" />
    <circle cx="22" cy="43" r="7.5" style="fill-opacity: 0.55" />
    <circle cx="76" cy="43" r="7.5" style="fill-opacity: 0.55" />
  </g>
  <g
    style="
      fill: none;
      stroke: var(--choco);
      stroke-opacity: 0.55;
      stroke-width: 4;
      stroke-linecap: round;
    "
  >
    <circle cx="418" cy="268" r="17" />
    <path d="M406 256 L430 280" />
  </g>
</svg>
