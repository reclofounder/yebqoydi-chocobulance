<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" class="scene__art layer-sky" aria-hidden="true" focusable="false">
  <!-- Road scene, back layer: the sky, 800x450, filling the stage (it does not travel). Its two
       stops read the road-sky-top / road-sky-bottom custom properties, which scenes.css sets on
       the road section to the dawn tokens; the timeline moves them toward the day tokens as the van drives. Phones
       see x 220-580. Tokens only. -->
  <defs>
    <linearGradient id="road-sky-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--road-sky-top, var(--sky-dawn-top))" />
      <stop offset="1" style="stop-color: var(--road-sky-bottom, var(--sky-dawn-bottom))" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" style="fill: url(#road-sky-fill)" />
  <circle cx="470" cy="150" r="64" style="fill: var(--cream); fill-opacity: 0.35" />
  <circle cx="470" cy="150" r="40" style="fill: var(--cream); fill-opacity: 0.9" />
  <g style="fill: var(--white); fill-opacity: 0.85">
    <path d="M252 116H352A20 20 0 0 0 330 92A30 30 0 0 0 276 88A24 24 0 0 0 252 116Z" />
    <path d="M540 72H612A15 15 0 0 0 596 54A22 22 0 0 0 557 51A18 18 0 0 0 540 72Z" />
    <path d="M60 64H140A16 16 0 0 0 122 44A24 24 0 0 0 79 41A19 19 0 0 0 60 64Z" />
    <path d="M660 170H750A18 18 0 0 0 730 148A27 27 0 0 0 682 144A21 21 0 0 0 660 170Z" />
  </g>
</svg>
