<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMax slice" class="scene__art" aria-hidden="true" focusable="false">
  <!-- Kitchen at sunrise, 800x500. Phones (4:5 stage) see x 200-600, desktop (16:9) y 50-500,
       so the story lives in x 200-600, y 50-500 and the wings are extras. The empty tub is the
       "patient" in the window's light, the kid leans in, and Dad peeks from behind the door frame
       with a spoon and a smear. #dad-peek is drawn before the doorway and the wall right of it,
       so sliding it right (scroll timeline) tucks him into the dark hall. Tokens only. -->
  <defs>
    <linearGradient id="kitchen-dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--sky-dawn-top)" />
      <stop offset="1" style="stop-color: var(--sky-dawn-bottom)" />
    </linearGradient>
    <pattern id="kitchen-tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 1.5H40M1.5 0V40" style="fill: none; stroke: var(--white); stroke-width: 3" />
    </pattern>
  </defs>

  <!-- Wall, tiled splashback, floor, skirting -->
  <rect width="800" height="500" style="fill: var(--cream)" />
  <rect y="262" width="800" height="164" style="fill: var(--sky-dawn-bottom)" />
  <rect y="262" width="800" height="164" style="fill: url(#kitchen-tiles)" />
  <rect y="426" width="800" height="74" style="fill: var(--hazel); fill-opacity: 0.45" />
  <path d="M0 454H800M0 480H800" style="stroke: var(--choco); stroke-opacity: 0.08; stroke-width: 2" />
  <rect y="420" width="800" height="8" style="fill: var(--white)" />

  <!-- Fridge with the kid's drawing of the van (desktop wing) -->
  <rect x="34" y="118" width="136" height="306" rx="18" style="fill: var(--white)" />
  <rect x="34" y="212" width="136" height="4" style="fill: var(--choco); fill-opacity: 0.1" />
  <g style="fill: var(--grey-out)">
    <rect x="148" y="152" width="8" height="42" rx="4" />
    <rect x="148" y="236" width="8" height="70" rx="4" />
  </g>
  <g transform="rotate(-6 92 276)">
    <rect x="60" y="250" width="64" height="50" rx="4" style="fill: var(--cream)" />
    <rect x="70" y="264" width="44" height="20" rx="6" style="fill: var(--red)" />
    <g style="fill: var(--choco)">
      <circle cx="80" cy="285" r="5" />
      <circle cx="104" cy="285" r="5" />
    </g>
  </g>
  <g style="fill: var(--red)">
    <rect x="64" y="134" width="6" height="18" rx="2" />
    <rect x="58" y="140" width="18" height="6" rx="2" />
  </g>

  <!-- Window: dawn sky, the sun and the TV tower over the roofs -->
  <rect x="212" y="62" width="136" height="152" rx="14" style="fill: var(--white)" />
  <rect x="224" y="74" width="112" height="128" rx="7" style="fill: url(#kitchen-dawn)" />
  <circle cx="306" cy="168" r="17" style="fill: var(--cream)" />
  <g style="fill: var(--hazel); fill-opacity: 0.55">
    <path d="M224 202V180H244V170H262V184H282V174H300V186H318V178H336V202Z" />
    <path d="M249 182L253 150H255.5L254.5 112H257.5L256.5 150H259L263 182Z" />
    <ellipse cx="256" cy="120" rx="6" ry="3" />
    <rect x="255.2" y="92" width="1.6" height="20" />
  </g>
  <path d="M280 74V202M224 138H336" style="stroke: var(--white); stroke-width: 6" />
  <rect x="202" y="208" width="156" height="12" rx="6" style="fill: var(--white)" />

  <!-- Morning light falling on the tub -->
  <path d="M234 220H330L472 330H352Z" style="fill: var(--white); fill-opacity: 0.4" />

  <!-- Pendant lamp -->
  <path d="M410 0V66" style="stroke: var(--choco-soft); stroke-width: 3" />
  <path d="M384 94Q384 66 410 66Q436 66 436 94Z" style="fill: var(--red)" />
  <path d="M398 94A12 8 0 0 0 422 94Z" style="fill: var(--cream)" />

  <!-- Table -->
  <g style="fill: var(--choco-soft)">
    <rect x="236" y="336" width="12" height="88" rx="4" />
    <rect x="508" y="336" width="12" height="88" rx="4" />
  </g>
  <rect x="226" y="342" width="304" height="12" rx="4" style="fill: var(--choco-soft); fill-opacity: 0.55" />
  <rect x="214" y="328" width="328" height="16" rx="8" style="fill: var(--hazel)" />

  <!-- Non on a plate -->
  <ellipse cx="252" cy="328" rx="30" ry="6" style="fill: var(--white)" />
  <ellipse cx="252" cy="320" rx="26" ry="9" style="fill: var(--hazel)" />
  <ellipse cx="252" cy="318" rx="13" ry="4.5" style="fill: var(--sky-dawn-bottom)" />

  <!-- The patient: an empty Chococream tub, licked clean -->
  <g transform="translate(400 328)">
    <ellipse cy="1" rx="46" ry="5" style="fill: var(--choco); fill-opacity: 0.14" />
    <path d="M-40 -56L-35 -6Q-34 0 -28 0H28Q34 0 35 -6L40 -56Z" style="fill: var(--red)" />
    <path d="M24 -56H40L35 -6Q34 0 28 0H20Z" style="fill: var(--red-deep); fill-opacity: 0.35" />
    <rect x="-33" y="-46" width="6" height="34" rx="3" style="fill: var(--white); fill-opacity: 0.35" />
    <ellipse cy="-26" rx="20" ry="13" style="fill: var(--cream)" />
    <path d="M-4 -36C-1 -32 3 -29 3 -25A6 6 0 0 1 -9 -25C-9 -29 -6 -32 -4 -36Z" style="fill: var(--choco)" />
    <circle cx="7" cy="-22" r="5" style="fill: var(--hazel)" />
    <ellipse cy="-56" rx="40" ry="9" style="fill: var(--red-deep)" />
    <ellipse cy="-55" rx="35" ry="6.5" style="fill: var(--cream)" />
    <path d="M-27 -55Q-14 -60 0 -56Q12 -53 22 -58Q16 -51 2 -51Q-14 -50 -27 -55Z" style="fill: var(--choco); fill-opacity: 0.55" />
    <g style="fill: var(--choco)">
      <path d="M-33 -53Q-20 -47 0 -46.5Q20 -47 33 -53L33 -50Q20 -44 0 -43.5Q-20 -44 -33 -50Z" />
      <rect x="-22" y="-47" width="7" height="15" rx="3.5" />
      <rect x="-1" y="-46" width="6" height="8" rx="3" />
      <rect x="15" y="-47" width="7" height="11" rx="3.5" />
    </g>
  </g>

  <!-- Its lid, leaning on the tub -->
  <g id="tub-lid">
    <ellipse cx="454" cy="302" rx="12" ry="30" transform="rotate(14 454 302)" style="fill: var(--red-deep)" />
    <ellipse cx="452" cy="302" rx="8" ry="25" transform="rotate(14 452 302)" style="fill: var(--red)" />
    <ellipse cx="449" cy="292" rx="2.5" ry="9" transform="rotate(14 449 292)" style="fill: var(--white); fill-opacity: 0.45" />
  </g>

  <!-- Tea: a piyola and a cotton-pattern choynak -->
  <path d="M470 316H492Q490 330 481 330Q472 330 470 316Z" style="fill: var(--white)" />
  <path d="M514 300Q498 300 496 288" style="fill: none; stroke: var(--white); stroke-width: 6; stroke-linecap: round" />
  <path d="M536 304Q548 304 546 316Q544 322 536 322" style="fill: none; stroke: var(--white); stroke-width: 5" />
  <ellipse cx="520" cy="312" rx="20" ry="17" style="fill: var(--white)" />
  <ellipse cx="520" cy="296" rx="10" ry="4" style="fill: var(--grey-out)" />
  <circle cx="520" cy="290" r="3.5" style="fill: var(--sky-day-top)" />
  <g style="fill: var(--sky-day-top)">
    <circle cx="512" cy="310" r="4" />
    <circle cx="526" cy="318" r="4" />
    <circle cx="528" cy="305" r="2.5" />
  </g>

  <!-- A trail of chocolate drops toward the doorway -->
  <g style="fill: var(--choco)">
    <ellipse cx="470" cy="472" rx="4" ry="2.5" />
    <ellipse cx="506" cy="462" rx="3.5" ry="2" />
    <ellipse cx="540" cy="470" rx="4" ry="2.5" />
    <ellipse cx="574" cy="458" rx="3.5" ry="2" />
  </g>

  <!-- The kid, from behind, leaning in -->
  <g style="fill: var(--hazel)">
    <rect x="287" y="398" width="11" height="30" rx="5" />
    <rect x="305" y="398" width="11" height="30" rx="5" />
  </g>
  <g style="fill: var(--white)">
    <rect x="283" y="424" width="19" height="12" rx="6" />
    <rect x="301" y="424" width="19" height="12" rx="6" />
  </g>
  <rect x="280" y="382" width="42" height="24" rx="9" style="fill: var(--choco-soft)" />
  <g transform="rotate(7 301 392)">
    <path d="M275 336L261 332M327 336L341 332" style="fill: none; stroke: var(--hazel); stroke-width: 10; stroke-linecap: round" />
    <path d="M276 392Q273 344 282 330Q290 320 301 320Q312 320 320 330Q329 344 326 392Z" style="fill: var(--sky-day-top)" />
    <g style="fill: var(--sky-day-top)">
      <circle cx="280" cy="336" r="9" />
      <circle cx="322" cy="336" r="9" />
    </g>
    <rect x="295" y="306" width="12" height="18" rx="5" style="fill: var(--hazel)" />
    <g style="fill: var(--hazel)">
      <circle cx="274" cy="292" r="7" />
      <circle cx="328" cy="292" r="7" />
    </g>
    <circle cx="301" cy="288" r="28" style="fill: var(--choco)" />
    <path d="M298 261Q292 249 302 245Q298 253 306 261Z" style="fill: var(--choco)" />
  </g>

  <!-- Dad, peeking: spoon hand, head, crumb (slides away right on scroll) -->
  <g id="dad-peek">
    <path d="M576 254Q552 252 534 262L538 282Q556 276 576 278Z" style="fill: var(--sky-day-top)" />
    <g transform="rotate(-36 524 270)">
      <rect x="466" y="266" width="60" height="7" rx="3.5" style="fill: var(--grey-out)" />
      <ellipse cx="462" cy="269.5" rx="13" ry="9" style="fill: var(--grey-out)" />
      <path d="M452 267Q462 260 472 267Q468 276 458 275Z" style="fill: var(--choco)" />
    </g>
    <rect x="514" y="258" width="26" height="24" rx="10" style="fill: var(--hazel)" />
    <path d="M520 264H532M520 271H532" style="stroke: var(--choco); stroke-opacity: 0.2; stroke-width: 2; stroke-linecap: round" />
    <circle cx="530" cy="198" r="34" style="fill: var(--hazel)" />
    <path d="M497 194Q494 160 530 160Q566 160 566 192L556 182Q536 172 512 182Q502 186 497 194Z" style="fill: var(--choco)" />
    <path d="M505 176Q513 168 522 175M531 173Q540 166 548 173" style="fill: none; stroke: var(--choco); stroke-width: 3; stroke-linecap: round" />
    <g style="fill: var(--white)">
      <ellipse cx="514" cy="191" rx="7.5" ry="6.5" />
      <ellipse cx="538" cy="191" rx="7.5" ry="6.5" />
    </g>
    <g style="fill: var(--choco)">
      <circle cx="510" cy="193" r="3.4" />
      <circle cx="534" cy="193" r="3.4" />
    </g>
    <circle cx="505" cy="210" r="6" style="fill: var(--red); fill-opacity: 0.25" />
    <ellipse cx="520" cy="205" rx="6" ry="5" style="fill: var(--choco); fill-opacity: 0.18" />
    <path d="M500 217Q508 207 520 213Q532 207 542 217Q532 223 520 218Q508 223 500 217Z" style="fill: var(--choco)" />
    <path d="M513 227Q521 231 529 227" style="fill: none; stroke: var(--choco); stroke-width: 2.5; stroke-linecap: round" />
    <path d="M501 223Q498 230 504 232Q510 233 510 227Q506 222 501 223Z" style="fill: var(--choco)" />
    <circle cx="496" cy="236" r="2.6" style="fill: var(--choco)" />
  </g>

  <!-- Doorway, door frame and the wall beyond: drawn over Dad -->
  <rect x="566" y="58" width="140" height="368" style="fill: var(--choco-soft)" />
  <rect x="604" y="112" width="64" height="272" rx="3" style="fill: var(--hazel); fill-opacity: 0.45" />
  <rect x="566" y="384" width="140" height="42" style="fill: var(--choco); fill-opacity: 0.25" />
  <rect x="724" width="76" height="426" style="fill: var(--cream)" />
  <rect x="724" y="262" width="76" height="158" style="fill: var(--sky-dawn-bottom)" />
  <rect x="724" y="262" width="76" height="158" style="fill: url(#kitchen-tiles)" />
  <rect x="724" y="420" width="76" height="8" style="fill: var(--white)" />
  <g style="fill: var(--white)">
    <rect x="548" y="52" width="20" height="374" rx="4" />
    <rect x="704" y="52" width="20" height="374" rx="4" />
    <rect x="540" y="42" width="192" height="18" rx="6" />
  </g>
  <rect x="566" y="60" width="3" height="366" style="fill: var(--choco); fill-opacity: 0.12" />
  <circle cx="764" cy="150" r="22" style="fill: var(--white)" />
  <path d="M764 136V150L774 156" style="fill: none; stroke: var(--choco-soft); stroke-width: 3; stroke-linecap: round" />
</svg>
