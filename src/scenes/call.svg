<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMax slice" class="scene__art" aria-hidden="true" focusable="false">
  <!-- The call, 800x500. Phones (4:5 stage) see x 200-600, desktop (16:9) y 50-500. The kid's
       phone on the left dials 1-0-5; a dashed line runs to the dispatcher on the right (white
       coat, chocolate badge, headset). Her speech bubble is HTML (#bubble, .scene__overlay).
       Timeline hooks: #digit-1/0/5 are the highlighted keys, drawn lit (fade them in);
       #call-line has pathLength="1" and a dash pattern that is drawn over [0, 1) and blank over
       [1, 2), so stroke-dashoffset 1 = hidden and 0 = fully drawn, dashes travelling from the
       phone to the headset in between. Digits are aria-hidden numerals. Tokens only. -->
  <rect width="800" height="500" style="fill: var(--sky-dawn-bottom)" />

  <!-- Signal rings around the phone -->
  <g style="fill: none; stroke: var(--white); stroke-opacity: 0.55; stroke-width: 10">
    <circle cx="296" cy="300" r="118" />
    <circle cx="296" cy="300" r="186" />
    <circle cx="296" cy="300" r="254" />
  </g>

  <!-- Wall clock at twenty to eight, and a framed map of the city (desktop wing) -->
  <circle cx="96" cy="150" r="44" style="fill: var(--white); stroke: var(--choco-soft); stroke-width: 6" />
  <path d="M96 150L84 167M96 150L122 135" style="fill: none; stroke: var(--choco); stroke-width: 4; stroke-linecap: round" />
  <circle cx="96" cy="150" r="4" style="fill: var(--red)" />
  <rect x="44" y="262" width="120" height="96" rx="10" style="fill: var(--white)" />
  <rect x="54" y="272" width="100" height="76" rx="5" style="fill: var(--sky-day-bottom)" />
  <path d="M100 280C126 278 142 294 140 310C138 330 118 340 98 338C76 336 64 324 66 306C68 290 80 282 100 280Z" style="fill: var(--red); fill-opacity: 0.15; stroke: var(--red); stroke-width: 3" />
  <circle cx="104" cy="308" r="5" style="fill: var(--red)" />

  <!-- The line from the phone to the headset -->
  <path id="call-line" pathLength="1" d="M362 236C406 214 452 236 474 292" style="fill: none; stroke: var(--red); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 0.03 0.067 0.03 0.067 0.03 0.067 0.03 0.067 0.03 0.067 0.03 0.067 0.03 0.067 0.03 0.067 0.03 0.067 0.03 0.067 0.03 1" />

  <!-- Dispatcher -->
  <path d="M436 500V404Q436 354 486 350H554Q604 354 604 404V500Z" style="fill: var(--white)" />
  <path d="M498 350L520 394L542 350Z" style="fill: var(--red)" />
  <path d="M490 350L520 408L550 350M520 408V500" style="fill: none; stroke: var(--choco-soft); stroke-width: 5; stroke-linejoin: round" />
  <rect x="510" y="328" width="20" height="26" rx="8" style="fill: var(--hazel)" />
  <g style="fill: var(--choco)">
    <circle cx="520" cy="254" r="17" />
    <circle cx="520" cy="302" r="41" />
  </g>
  <circle cx="520" cy="306" r="36" style="fill: var(--hazel)" />
  <path d="M484 300Q486 266 520 266Q554 266 556 300Q540 282 520 287Q500 282 484 300Z" style="fill: var(--choco)" />
  <g style="fill: var(--choco)">
    <circle cx="507" cy="308" r="3.6" />
    <circle cx="533" cy="308" r="3.6" />
  </g>
  <g style="fill: var(--red); fill-opacity: 0.25">
    <circle cx="498" cy="320" r="6" />
    <circle cx="542" cy="320" r="6" />
  </g>
  <path d="M509 324Q520 334 531 324" style="fill: none; stroke: var(--choco); stroke-width: 3; stroke-linecap: round" />
  <path d="M478 302Q478 254 520 254Q562 254 562 302" style="fill: none; stroke: var(--choco-soft); stroke-width: 6" />
  <g style="fill: var(--choco)">
    <rect x="470" y="292" width="14" height="26" rx="7" />
    <rect x="556" y="292" width="14" height="26" rx="7" />
  </g>
  <path d="M478 316Q482 338 504 338" style="fill: none; stroke: var(--choco-soft); stroke-width: 4; stroke-linecap: round" />
  <circle cx="506" cy="338" r="4.5" style="fill: var(--red)" />
  <!-- Chocolate badge: a drop on a red cross -->
  <circle cx="574" cy="424" r="15" style="fill: var(--choco); stroke: var(--hazel); stroke-width: 3" />
  <g style="fill: var(--red)">
    <rect x="571" y="414" width="6" height="20" rx="2" />
    <rect x="564" y="421" width="20" height="6" rx="2" />
  </g>
  <path d="M574 416C576 419 579 422 579 425A5 5 0 0 1 569 425C569 422 572 419 574 416Z" style="fill: var(--cream)" />

  <!-- Desk with the dispatch map on screen (desktop wing) -->
  <rect x="420" y="452" width="380" height="48" style="fill: var(--hazel)" />
  <rect x="420" y="452" width="380" height="6" style="fill: var(--white); fill-opacity: 0.3" />
  <rect x="692" y="420" width="16" height="34" style="fill: var(--choco-soft)" />
  <rect x="618" y="300" width="164" height="124" rx="10" style="fill: var(--choco)" />
  <rect x="628" y="310" width="144" height="104" rx="5" style="fill: var(--sky-day-bottom)" />
  <path d="M628 352H772M676 310V414M736 310V414M628 392L772 330" style="fill: none; stroke: var(--white); stroke-width: 5" />
  <ellipse cx="700" cy="362" rx="52" ry="36" style="fill: none; stroke: var(--red); stroke-opacity: 0.45; stroke-width: 3" />
  <path d="M712 362C704 352 700 346 700 340A12 12 0 0 1 724 340C724 346 720 352 712 362Z" style="fill: var(--red)" />
  <circle cx="712" cy="340" r="4" style="fill: var(--white)" />

  <!-- The kid's hand and phone, dialling 105 -->
  <path d="M206 500L214 432Q244 414 280 430L290 500Z" style="fill: var(--sky-day-top)" />
  <g transform="rotate(8 296 300)">
    <rect x="252" y="372" width="72" height="98" rx="30" style="fill: var(--hazel)" />
    <rect x="232" y="155" width="128" height="290" rx="24" style="fill: var(--choco)" />
    <rect x="242" y="178" width="108" height="252" rx="14" style="fill: var(--cream)" />
    <rect x="278" y="164" width="36" height="5" rx="2.5" style="fill: var(--choco-soft)" />
    <rect x="254" y="190" width="84" height="32" rx="10" style="fill: var(--white)" />
    <g style="fill: var(--choco-soft)">
      <circle cx="282" cy="206" r="3.5" />
      <circle cx="296" cy="206" r="3.5" />
      <circle cx="310" cy="206" r="3.5" />
    </g>
    <g style="fill: var(--white)">
      <circle cx="266" cy="246" r="13" /><circle cx="296" cy="246" r="13" /><circle cx="326" cy="246" r="13" />
      <circle cx="266" cy="280" r="13" /><circle cx="296" cy="280" r="13" /><circle cx="326" cy="280" r="13" />
      <circle cx="266" cy="314" r="13" /><circle cx="296" cy="314" r="13" /><circle cx="326" cy="314" r="13" />
      <circle cx="266" cy="348" r="13" /><circle cx="296" cy="348" r="13" /><circle cx="326" cy="348" r="13" />
    </g>
    <g style="font-family: var(--font-display); font-weight: 800; font-size: 16px; text-anchor: middle">
      <g style="fill: var(--choco)">
        <text x="266" y="252" aria-hidden="true">1</text>
        <text x="296" y="252" aria-hidden="true">2</text>
        <text x="326" y="252" aria-hidden="true">3</text>
        <text x="266" y="286" aria-hidden="true">4</text>
        <text x="296" y="286" aria-hidden="true">5</text>
        <text x="326" y="286" aria-hidden="true">6</text>
        <text x="266" y="320" aria-hidden="true">7</text>
        <text x="296" y="320" aria-hidden="true">8</text>
        <text x="326" y="320" aria-hidden="true">9</text>
        <text x="266" y="354" aria-hidden="true">*</text>
        <text x="296" y="354" aria-hidden="true">0</text>
        <text x="326" y="354" aria-hidden="true">#</text>
      </g>
      <!-- The three keys pressed for 105: a red key with a white numeral over the plain one -->
      <g id="digit-1">
        <circle cx="266" cy="246" r="14" style="fill: var(--red)" />
        <text x="266" y="252" aria-hidden="true" style="fill: var(--white)">1</text>
      </g>
      <g id="digit-0">
        <circle cx="296" cy="348" r="14" style="fill: var(--red)" />
        <text x="296" y="354" aria-hidden="true" style="fill: var(--white)">0</text>
      </g>
      <g id="digit-5">
        <circle cx="296" cy="280" r="14" style="fill: var(--red)" />
        <text x="296" y="286" aria-hidden="true" style="fill: var(--white)">5</text>
      </g>
    </g>
    <circle cx="296" cy="392" r="18" style="fill: var(--red)" />
    <path transform="translate(284 380)" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C9.61 21 3 14.39 3 6a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z" style="fill: var(--white)" />
    <g style="fill: var(--hazel)">
      <rect x="348" y="300" width="22" height="16" rx="8" />
      <rect x="350" y="320" width="22" height="16" rx="8" />
      <rect x="348" y="340" width="20" height="16" rx="8" />
      <rect x="222" y="330" width="24" height="16" rx="8" />
    </g>
  </g>
</svg>
