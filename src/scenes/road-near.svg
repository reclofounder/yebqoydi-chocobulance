<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 450" preserveAspectRatio="xMinYMax slice" class="scene__art layer-near" aria-hidden="true" focusable="false">
  <!-- Road scene, near layer, 1600x450 at twice the stage's width: sidewalk with lamp posts, a
       metro "M" sign and a bus stop, the curb, and the road the van drives on (wheels touch
       about y 432). #road-lines is the dashed centre line. Phones only see x 0-720.
       Tokens only. -->
  <!-- Sidewalk -->
  <rect y="338" width="1600" height="22" style="fill: var(--grey-out)" />
  <path d="M0 349H1600" style="fill: none; stroke: var(--white); stroke-opacity: 0.5; stroke-width: 2; stroke-dasharray: 2 38" />

  <!-- Lamp posts -->
  <g style="fill: var(--choco)">
    <rect x="136" y="170" width="7" height="178" rx="3.5" />
    <rect x="456" y="170" width="7" height="178" rx="3.5" />
    <rect x="856" y="170" width="7" height="178" rx="3.5" />
    <rect x="1176" y="170" width="7" height="178" rx="3.5" />
    <rect x="1496" y="170" width="7" height="178" rx="3.5" />
  </g>
  <path d="M139.5 176Q140 160 156 160H164M459.5 176Q460 160 476 160H484M859.5 176Q860 160 876 160H884M1179.5 176Q1180 160 1196 160H1204M1499.5 176Q1500 160 1516 160H1524" style="fill: none; stroke: var(--choco); stroke-width: 6; stroke-linecap: round" />
  <g style="fill: var(--choco)">
    <rect x="158" y="156" width="28" height="10" rx="5" />
    <rect x="478" y="156" width="28" height="10" rx="5" />
    <rect x="878" y="156" width="28" height="10" rx="5" />
    <rect x="1198" y="156" width="28" height="10" rx="5" />
    <rect x="1518" y="156" width="28" height="10" rx="5" />
  </g>
  <g style="fill: var(--cream)">
    <circle cx="172" cy="168" r="6" />
    <circle cx="492" cy="168" r="6" />
    <circle cx="892" cy="168" r="6" />
    <circle cx="1212" cy="168" r="6" />
    <circle cx="1532" cy="168" r="6" />
  </g>

  <!-- Metro sign: a red M on a white board -->
  <rect x="296" y="232" width="8" height="116" rx="3" style="fill: var(--choco-soft)" />
  <rect x="274" y="196" width="52" height="48" rx="12" style="fill: var(--white); stroke: var(--choco-soft); stroke-width: 3" />
  <path d="M283 234V206H291L300 222L309 206H317V234H310V219L300 234L290 219V234Z" style="fill: var(--red)" />

  <!-- Bus stop: roof, glass, bench, and its sign -->
  <rect x="552" y="234" width="146" height="14" rx="7" style="fill: var(--red-deep)" />
  <rect x="562" y="248" width="126" height="90" style="fill: var(--sky-day-bottom); fill-opacity: 0.75" />
  <g style="fill: var(--choco-soft)">
    <rect x="558" y="246" width="7" height="102" rx="3" />
    <rect x="685" y="246" width="7" height="102" rx="3" />
    <rect x="580" y="314" width="90" height="9" rx="4" />
    <rect x="590" y="322" width="6" height="22" />
    <rect x="654" y="322" width="6" height="22" />
    <rect x="718" y="240" width="6" height="108" rx="3" />
  </g>
  <circle cx="721" cy="232" r="20" style="fill: var(--white); stroke: var(--choco-soft); stroke-width: 3" />
  <rect x="709" y="222" width="24" height="16" rx="4" style="fill: var(--choco-soft)" />
  <rect x="712" y="225" width="18" height="5" rx="1.5" style="fill: var(--white)" />
  <g style="fill: var(--choco)">
    <circle cx="714" cy="239" r="2.5" />
    <circle cx="728" cy="239" r="2.5" />
  </g>

  <!-- Benches and bins (desktop only) -->
  <g style="fill: var(--choco-soft)">
    <rect x="980" y="318" width="76" height="8" rx="4" />
    <rect x="986" y="326" width="6" height="20" />
    <rect x="1044" y="326" width="6" height="20" />
    <rect x="1340" y="314" width="24" height="34" rx="5" />
  </g>
  <rect x="980" y="300" width="76" height="8" rx="4" style="fill: var(--hazel)" />

  <!-- Curb, road, centre line -->
  <rect y="358" width="1600" height="6" style="fill: var(--white)" />
  <rect y="364" width="1600" height="86" style="fill: var(--choco-soft)" />
  <rect y="364" width="1600" height="6" style="fill: var(--choco); fill-opacity: 0.2" />
  <g id="road-lines">
    <path d="M0 406H1600" style="fill: none; stroke: var(--cream); stroke-width: 6; stroke-dasharray: 44 36" />
  </g>
</svg>
