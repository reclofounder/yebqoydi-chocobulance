<!doctype html>
<html lang="uz" data-booting>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C71920" />
    <!-- The title and description ship in Uzbek, filled from src/config.ts and uz.json (a test keeps
         them in step): link previews and crawlers do not run the script that translates them. -->
    <title data-i18n="meta.title">Chocobulance — Chococream shokolad tez yordami</title>
    <meta
      name="description"
      content="Yebqoʻydingizmi? 71&nbsp;209&nbsp;99&nbsp;00 raqamiga qoʻngʻiroq qiling — choco doktorlar uyingizga kelib, kichkintoyni ovutadi. Xizmat bepul, shokolad pastasi 99&nbsp;000 soʻm. Faqat Toshkent shahri ichida."
      data-i18n="meta.description"
    />
    <!-- The "20 yoshda" of the Chococream 20 lockup on brand red: the .ico (16, 32, 48 px) for tabs
         and bookmarks, 192 px for Android, 180 px (square, iOS rounds it) for the home screen. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- %VITE_SITE_URL% is the site's public origin, filled in at build time (vite.config.ts,
         siteUrl): set VITE_SITE_URL on Railway and these tags become absolute, as link previews
         need; unset, they stay relative (README, Deploy). Languages: src/i18n.ts also points the
         uz and ru hrefs at the current origin at runtime, for crawlers that run scripts.
         vite-ignore: these are pages, not assets; Vite would try to bundle "/" and fail. -->
    <link rel="alternate" hreflang="uz" href="%VITE_SITE_URL%/?lang=uz" vite-ignore />
    <link rel="alternate" hreflang="ru" href="%VITE_SITE_URL%/?lang=ru" vite-ignore />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/" vite-ignore />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Chocobulance" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta
      property="og:title"
      content="Chocobulance — Chococream shokolad tez yordami"
      data-i18n="meta.title"
    />
    <meta
      property="og:description"
      content="Yebqoʻydingizmi? 71&nbsp;209&nbsp;99&nbsp;00 raqamiga qoʻngʻiroq qiling — choco doktorlar uyingizga kelib, kichkintoyni ovutadi. Xizmat bepul, shokolad pastasi 99&nbsp;000 soʻm. Faqat Toshkent shahri ichida."
      data-i18n="meta.description"
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Chocobulance — Chococream shokolad tez yordami"
      data-i18n="meta.title"
    />
    <meta
      name="twitter:description"
      content="Yebqoʻydingizmi? 71&nbsp;209&nbsp;99&nbsp;00 raqamiga qoʻngʻiroq qiling — choco doktorlar uyingizga kelib, kichkintoyni ovutadi. Xizmat bepul, shokolad pastasi 99&nbsp;000 soʻm. Faqat Toshkent shahri ichida."
      data-i18n="meta.description"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2"
    />
    <!-- Baloo 2 has no Cyrillic, so Russian headlines are set in Nunito. Only a Russian visitor
         needs it for the first paint; the script below promotes this to a preload. -->
    <link
      rel="x-preload-ru"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/nunito/files/nunito-cyrillic-900-normal.woff2"
    />
    <!-- No script, no copy to wait for: show the shell as it is (see data-booting in base.css).
         !important because the bundled stylesheet comes after this one and would win a tie. -->
    <noscript
      ><style>
        html[data-booting] body {
          visibility: visible !important;
        }
      </style></noscript
    >
    <script>
      // The language as getLang() (src/i18n.ts) will decide it: ?lang=, then the stored choice.
      // Without this the Cyrillic font arrives after the first paint and the headline reflows.
      (function () {
        var lang = new URLSearchParams(location.search).get('lang');
        try {
          if (lang !== 'uz' && lang !== 'ru') lang = localStorage.getItem('lang');
        } catch (e) {}
        if (lang !== 'ru') return;
        document.querySelectorAll('link[rel="x-preload-ru"]').forEach(function (link) {
          link.rel = 'preload';
        });
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
    <header id="header" class="header" data-scrolled="false">
      <div class="header__inner">
        <a class="brand" href="#top">
          <img
            src="/brand/chococream-20-on-red.png"
            width="783"
            height="179"
            alt="Chococream 20 yoshda"
          />
        </a>
        <a class="call" href="tel:+998712099900" data-cta data-i18n-attr="aria-label:a11y.call"
          ><span class="call__label" data-i18n="header.call"></span
        ></a>
        <div class="lang" role="group" data-i18n-attr="aria-label:a11y.lang">
          <button
            type="button"
            class="lang__btn"
            lang="uz"
            data-lang="uz"
            aria-pressed="true"
            data-i18n="header.lang.uz"
          ></button>
          <button
            type="button"
            class="lang__btn"
            lang="ru"
            data-lang="ru"
            aria-pressed="false"
            data-i18n="header.lang.ru"
          ></button>
        </div>
      </div>
    </header>

    <!-- One long red page: the words in the order things happen, and the car driving between them.
         Each lane is a strip the car crosses while it scrolls through the screen (scroll/car.ts);
         data-lane says which way: enter (already half in, drives off left), ltr, rtl, or arrive
         (comes in from the right and parks in the middle). -->
    <main id="main" tabindex="-1">
      <section id="top" class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="hero__title">
          <span class="visually-hidden" data-i18n="hero.title"></span>
          <!-- The headline on a gentle arc, as in the campaign teaser. The real words are above, for
               screen readers and search; this drawing of them is hidden from both. -->
          <svg class="hero__arc" viewBox="0 0 1200 300" aria-hidden="true" focusable="false">
            <path id="hero-arc" d="M 30 250 Q 600 90 1170 250" fill="none" />
            <text>
              <textPath
                href="#hero-arc"
                startOffset="50%"
                text-anchor="middle"
                data-i18n="hero.title"
              ></textPath>
            </text>
          </svg>
        </h1>
      </section>

      <div class="lane" data-lane="enter" aria-hidden="true">
        <div class="car car--left" data-car>
          <img
            class="car__body"
            src="/car/left.avif"
            srcset="/car/left-720.avif 720w, /car/left.avif 1440w"
            sizes="(max-width: 583px) 280px, (max-width: 1500px) 48vw, 720px"
            width="1440"
            height="622"
            alt=""
            fetchpriority="high"
          />
          <img
            class="car__wheel car__wheel--a"
            src="/car/left-wheel-a.avif"
            srcset="/car/left-wheel-a-720.avif 84w, /car/left-wheel-a.avif 168w"
            sizes="(max-width: 583px) 34px, (max-width: 1500px) 5.6vw, 84px"
            width="168"
            height="168"
            alt=""
          />
          <img
            class="car__wheel car__wheel--b"
            src="/car/left-wheel-b.avif"
            srcset="/car/left-wheel-b-720.avif 84w, /car/left-wheel-b.avif 167w"
            sizes="(max-width: 583px) 34px, (max-width: 1500px) 5.6vw, 84px"
            width="167"
            height="167"
            alt=""
          />
        </div>
      </div>

      <!-- The little ones who need comforting: two boys with an empty tub, either side of the words. -->
      <section class="beat beat--boys" aria-labelledby="soothe-title">
        <img
          class="boy boy--a"
          src="/boys/curly.avif"
          srcset="/boys/curly-450.avif 341w, /boys/curly.avif 681w"
          sizes="(max-width: 899px) 45vw, 340px"
          width="681"
          height="900"
          alt=""
          loading="lazy"
          decoding="async"
          data-reveal
        />
        <h2 id="soothe-title" class="beat__title" data-reveal data-i18n="soothe.title"></h2>
        <img
          class="boy boy--b"
          src="/boys/yellow.avif"
          srcset="/boys/yellow-450.avif 300w, /boys/yellow.avif 601w"
          sizes="(max-width: 899px) 45vw, 300px"
          width="601"
          height="900"
          alt=""
          loading="lazy"
          decoding="async"
          data-reveal
        />
      </section>

      <div class="lane" data-lane="ltr" aria-hidden="true">
        <div class="car car--right" data-car>
          <img
            class="car__body"
            src="/car/right.avif"
            srcset="/car/right-720.avif 720w, /car/right.avif 1440w"
            sizes="(max-width: 583px) 280px, (max-width: 1500px) 48vw, 720px"
            width="1440"
            height="622"
            alt=""
          />
          <img
            class="car__wheel car__wheel--a"
            src="/car/right-wheel-a.avif"
            srcset="/car/right-wheel-a-720.avif 84w, /car/right-wheel-a.avif 167w"
            sizes="(max-width: 583px) 34px, (max-width: 1500px) 5.6vw, 84px"
            width="167"
            height="167"
            alt=""
          />
          <img
            class="car__wheel car__wheel--b"
            src="/car/right-wheel-b.avif"
            srcset="/car/right-wheel-b-720.avif 84w, /car/right-wheel-b.avif 168w"
            sizes="(max-width: 583px) 34px, (max-width: 1500px) 5.6vw, 84px"
            width="168"
            height="168"
            alt=""
          />
        </div>
      </div>

      <section class="beat" aria-labelledby="call-title">
        <h2 id="call-title" class="beat__title" data-reveal>
          <span data-i18n="call.before"></span>
          <a class="tel" href="tel:+998712099900" data-tel data-i18n="call.number"></a>
          <span data-i18n="call.after"></span>
        </h2>
      </section>

      <section class="beat beat--arrive" aria-labelledby="door-title">
        <h2 id="door-title" class="beat__title" data-reveal data-i18n="door.title"></h2>
        <div class="lane" data-lane="arrive" aria-hidden="true">
          <div class="car car--left" data-car>
            <img
              class="car__body"
              src="/car/left.avif"
              srcset="/car/left-720.avif 720w, /car/left.avif 1440w"
              sizes="(max-width: 583px) 280px, (max-width: 1500px) 48vw, 720px"
              width="1440"
              height="622"
              alt=""
            />
            <img
              class="car__wheel car__wheel--a"
              src="/car/left-wheel-a.avif"
              srcset="/car/left-wheel-a-720.avif 84w, /car/left-wheel-a.avif 168w"
              sizes="(max-width: 583px) 34px, (max-width: 1500px) 5.6vw, 84px"
              width="168"
              height="168"
              alt=""
            />
            <img
              class="car__wheel car__wheel--b"
              src="/car/left-wheel-b.avif"
              srcset="/car/left-wheel-b-720.avif 84w, /car/left-wheel-b.avif 167w"
              sizes="(max-width: 583px) 34px, (max-width: 1500px) 5.6vw, 84px"
              width="167"
              height="167"
              alt=""
            />
          </div>
        </div>
      </section>

      <section id="how" class="block" aria-labelledby="how-title">
        <h2 id="how-title" class="block__title" data-reveal data-i18n="how.title"></h2>
        <!-- Three cards, step by step: the numbers come from a CSS counter, the icons are drawn here. -->
        <ol class="steps">
          <li class="step" data-reveal>
            <svg class="step__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C9.61 21 3 14.39 3 6a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"
              />
            </svg>
            <p class="step__text" data-i18n="how.1"></p>
          </li>
          <li class="step" data-reveal>
            <svg class="step__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M12 2a7.5 7.5 0 0 0-7.5 7.5c0 5.3 6.2 11.7 6.9 12.3a.86.86 0 0 0 1.2 0c.7-.6 6.9-7 6.9-12.3A7.5 7.5 0 0 0 12 2zm0 10.5a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"
              />
            </svg>
            <p class="step__text" data-i18n="how.2"></p>
          </li>
          <li class="step" data-reveal>
            <svg class="step__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M12 21.2c-.3 0-.6-.1-.8-.3C6.4 16.8 2.5 13.3 2.5 8.9 2.5 5.9 4.8 3.6 7.7 3.6c1.7 0 3.3.8 4.3 2.1 1-1.3 2.6-2.1 4.3-2.1 2.9 0 5.2 2.3 5.2 5.3 0 4.4-3.9 7.9-8.7 12-.2.2-.5.3-.8.3z"
              />
            </svg>
            <p class="step__text" data-i18n="how.3"></p>
          </li>
        </ol>
      </section>

      <section id="price" class="block" aria-labelledby="price-title">
        <h2 id="price-title" class="block__title" data-reveal data-i18n="price.free"></h2>
        <p class="block__line" data-reveal data-i18n="price.tub"></p>
      </section>

      <div class="lane" data-lane="ltr" aria-hidden="true">
        <div class="car car--right" data-car>
          <img
            class="car__body"
            src="/car/right.avif"
            srcset="/car/right-720.avif 720w, /car/right.avif 1440w"
            sizes="(max-width: 583px) 280px, (max-width: 1500px) 48vw, 720px"
            width="1440"
            height="622"
            alt=""
          />
          <img
            class="car__wheel car__wheel--a"
            src="/car/right-wheel-a.avif"
            srcset="/car/right-wheel-a-720.avif 84w, /car/right-wheel-a.avif 167w"
            sizes="(max-width: 583px) 34px, (max-width: 1500px) 5.6vw, 84px"
            width="167"
            height="167"
            alt=""
          />
          <img
            class="car__wheel car__wheel--b"
            src="/car/right-wheel-b.avif"
            srcset="/car/right-wheel-b-720.avif 84w, /car/right-wheel-b.avif 168w"
            sizes="(max-width: 583px) 34px, (max-width: 1500px) 5.6vw, 84px"
            width="168"
            height="168"
            alt=""
          />
        </div>
      </div>

      <section id="area" class="block" aria-labelledby="area-title">
        <h2 id="area-title" class="block__title" data-reveal data-i18n="area.title"></h2>
        <!-- OpenStreetMap with the city's boundary, built by src/map/area-map.ts once it is near. -->
        <div
          class="area-map"
          data-area-map
          role="region"
          data-i18n-attr="aria-label:area.map"
        ></div>
      </section>
    </main>

    <footer class="footer">
      <p data-i18n="footer.copy"></p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
