<!doctype html>
<html lang="uz" data-booting>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF6EC" />
    <!-- The title and description ship in Uzbek, filled from src/config.ts and uz.json (a test keeps
         them in step): link previews and crawlers do not run the script that translates them. -->
    <title data-i18n="meta.title">Chocobulance · 105 — Chococream shokolad tez yordami</title>
    <meta
      name="description"
      content="Chococream tugadimi? 105 ga qoʻngʻiroq qiling — Chocobulance yangi idishni Toshkent boʻylab uyingizgacha yetkazib beradi. 99 000 soʻm, toʻlov yetkazib berilganda."
      data-i18n="meta.description"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- %VITE_SITE_URL% is the site's public origin, filled in at build time (vite.config.ts,
         siteUrl): set VITE_SITE_URL on Railway and these tags become absolute, as link previews
         need; unset, they stay relative (README, Deploy). Languages: src/i18n.ts also points the
         uz and ru hrefs at the current origin at runtime, for crawlers that run scripts.
         vite-ignore: these are pages, not assets; Vite would try to bundle "/" and fail. -->
    <link rel="alternate" hreflang="uz" href="%VITE_SITE_URL%/?lang=uz" vite-ignore />
    <link rel="alternate" hreflang="ru" href="%VITE_SITE_URL%/?lang=ru" vite-ignore />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/" vite-ignore />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Chocobulance" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta
      property="og:title"
      content="Chocobulance · 105 — Chococream shokolad tez yordami"
      data-i18n="meta.title"
    />
    <meta
      property="og:description"
      content="Chococream tugadimi? 105 ga qoʻngʻiroq qiling — Chocobulance yangi idishni Toshkent boʻylab uyingizgacha yetkazib beradi. 99 000 soʻm, toʻlov yetkazib berilganda."
      data-i18n="meta.description"
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Chocobulance · 105 — Chococream shokolad tez yordami"
      data-i18n="meta.title"
    />
    <meta
      name="twitter:description"
      content="Chococream tugadimi? 105 ga qoʻngʻiroq qiling — Chocobulance yangi idishni Toshkent boʻylab uyingizgacha yetkazib beradi. 99 000 soʻm, toʻlov yetkazib berilganda."
      data-i18n="meta.description"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2"
    />
    <!-- Only a Russian visitor needs Cyrillic for the first paint; the script below promotes these. -->
    <link
      rel="x-preload-ru"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/nunito/files/nunito-cyrillic-800-normal.woff2"
    />
    <link
      rel="x-preload-ru"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/nunito/files/nunito-cyrillic-900-normal.woff2"
    />
    <!-- No script, no copy to wait for: show the shell as it is (see data-booting in base.css).
         !important because the bundled stylesheet comes after this one and would win a tie. -->
    <noscript
      ><style>
        html[data-booting] body {
          visibility: visible !important;
        }
      </style></noscript
    >
    <script>
      // The language as getLang() (src/i18n.ts) will decide it: ?lang=, then the stored choice.
      // Without this the Cyrillic subset arrives after the first paint and the headline reflows.
      (function () {
        var lang = new URLSearchParams(location.search).get('lang');
        try {
          if (lang !== 'uz' && lang !== 'ru') lang = localStorage.getItem('lang');
        } catch (e) {}
        if (lang !== 'ru') return;
        document.querySelectorAll('link[rel="x-preload-ru"]').forEach(function (link) {
          link.rel = 'preload';
        });
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
    <header id="header" class="header" data-scrolled="false" data-cta-visible="false">
      <div class="header__inner">
        <a class="brand" href="#hero" data-i18n="header.brand">Chocobulance</a>
        <a class="cta cta--compact" href="tel:105" data-cta data-i18n="sticky.cta"></a>
        <span class="phone-hint header__hint" data-phone-hint hidden></span>
        <div class="lang" role="group" data-i18n-attr="aria-label:a11y.lang">
          <button
            type="button"
            class="lang__btn"
            lang="uz"
            data-lang="uz"
            aria-pressed="true"
            data-i18n="header.lang.uz"
          ></button>
          <button
            type="button"
            class="lang__btn"
            lang="ru"
            data-lang="ru"
            aria-pressed="false"
            data-i18n="header.lang.ru"
          ></button>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <!-- Pinned scenes: .scene__copy holds the words, .scene__stage[data-stage] is filled with art later. -->
      <section id="hero" class="scene" data-scene="hero" aria-labelledby="hero-title">
        <div class="scene__copy">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 id="hero-title" class="hero__title">
            <span class="hero__line" data-i18n="hero.title"></span>
            <span class="hero__line hero__line--accent" data-i18n="hero.title2"></span>
          </h1>
          <p class="body" data-i18n="hero.body"></p>
          <div class="hero__actions">
            <a class="cta" href="tel:105" data-cta data-i18n="hero.cta"></a>
            <a class="cta cta--ghost" href="#how" data-i18n="hero.cta2"></a>
          </div>
          <p class="note" data-i18n="hero.note" data-state-note></p>
          <p class="phone-hint" data-phone-hint hidden></p>
        </div>
        <div class="scene__stage" data-stage></div>
        <!-- Part of the art zone: drawn over the stage cell, not inside the copy column. -->
        <div class="hero__numeral" data-i18n="hero.numeral" aria-hidden="true"></div>
        <p class="hero__scroll" data-i18n="hero.scroll" aria-hidden="true"></p>
      </section>

      <section
        id="scene-kitchen"
        class="scene"
        data-scene="kitchen"
        aria-labelledby="kitchen-title"
      >
        <div class="scene__copy">
          <p class="eyebrow" data-i18n="kitchen.eyebrow"></p>
          <h2 id="kitchen-title" data-i18n="kitchen.title"></h2>
          <p class="body" data-i18n="kitchen.body"></p>
          <div class="card">
            <h3 class="card__title" data-i18n="kitchen.list.title"></h3>
            <ul class="card__list" role="list">
              <li data-i18n="kitchen.list.1"></li>
              <li data-i18n="kitchen.list.2"></li>
              <li data-i18n="kitchen.list.3"></li>
              <li data-i18n="kitchen.list.4"></li>
            </ul>
          </div>
        </div>
        <div class="scene__stage" data-stage></div>
      </section>

      <section id="scene-call" class="scene" data-scene="call" aria-labelledby="call-title">
        <div class="scene__copy">
          <p class="eyebrow" data-i18n="call.eyebrow"></p>
          <h2 id="call-title" data-i18n="call.title"></h2>
          <p class="body" data-i18n="call.body"></p>
        </div>
        <div class="scene__stage" data-stage></div>
        <!-- Copy that belongs to the art, laid over the stage: real text, so it translates and wraps. -->
        <div class="scene__overlay">
          <p id="bubble" class="bubble" data-i18n="call.bubble"></p>
          <!-- The real number on the dispatcher's desk, shown only once it differs from the hook (state.ts). -->
          <p class="dispatcher-line" data-phone-line hidden>
            <span class="dispatcher-line__label" data-i18n="call.phone.label"></span>
            <span class="dispatcher-line__number" data-phone-number></span>
          </p>
        </div>
      </section>

      <section id="scene-road" class="scene" data-scene="road" aria-labelledby="road-title">
        <div class="scene__copy">
          <p class="eyebrow" data-i18n="road.eyebrow"></p>
          <h2 id="road-title" data-i18n="road.title"></h2>
          <p class="body" data-i18n="road.body"></p>
        </div>
        <div class="scene__stage" data-stage></div>
      </section>

      <section id="scene-door" class="scene" data-scene="door" aria-labelledby="door-title">
        <div class="scene__copy">
          <p class="eyebrow" data-i18n="door.eyebrow"></p>
          <h2 id="door-title" data-i18n="door.title"></h2>
          <p class="body" data-i18n="door.body"></p>
        </div>
        <div class="scene__stage" data-stage></div>
        <div class="scene__overlay">
          <div id="price-badge" class="price-badge">
            <p class="price-badge__price" data-i18n="door.price"></p>
            <p class="price-badge__note" data-i18n="door.price.note"></p>
          </div>
        </div>
      </section>

      <!-- Static sections -->
      <section id="how" class="section" aria-labelledby="how-title">
        <div class="container">
          <h2 id="how-title" class="section__title" data-i18n="how.title"></h2>
          <ol class="steps" role="list">
            <li>
              <article class="step">
                <span class="step__num" aria-hidden="true">1</span>
                <h3 class="step__title" data-i18n="how.1.title"></h3>
                <p class="step__body" data-i18n="how.1.body"></p>
              </article>
            </li>
            <li>
              <article class="step">
                <span class="step__num" aria-hidden="true">2</span>
                <h3 class="step__title" data-i18n="how.2.title"></h3>
                <p class="step__body" data-i18n="how.2.body"></p>
              </article>
            </li>
            <li>
              <article class="step">
                <span class="step__num" aria-hidden="true">3</span>
                <h3 class="step__title" data-i18n="how.3.title"></h3>
                <p class="step__body" data-i18n="how.3.body"></p>
              </article>
            </li>
          </ol>
          <a class="cta how__cta" href="tel:105" data-cta data-i18n="hero.cta"></a>
          <p class="phone-hint how__hint" data-phone-hint hidden></p>
        </div>
      </section>

      <section id="coverage" class="section" aria-labelledby="coverage-title">
        <div class="container">
          <div class="section__head">
            <h2 id="coverage-title" class="section__title" data-i18n="coverage.title"></h2>
            <p class="section__lead" data-i18n="coverage.body"></p>
          </div>
          <div class="coverage__grid">
            <!-- coverage.svg is injected into [data-stage] by src/scenes/mount.ts; the labels are real text over it. -->
            <div class="coverage__map">
              <div class="coverage__stage" data-stage></div>
              <p class="coverage__label coverage__label--in" data-i18n="coverage.inside"></p>
              <p class="coverage__label coverage__label--out" data-i18n="coverage.outside"></p>
            </div>
            <div class="coverage__info">
              <div class="price-card">
                <p class="price-card__price" data-i18n="coverage.price"></p>
                <p class="price-card__note" data-i18n="coverage.price.note"></p>
              </div>
              <dl class="hours">
                <dt data-i18n="coverage.hours.label"></dt>
                <dd data-i18n="coverage.hours.value"></dd>
              </dl>
            </div>
          </div>
        </div>
      </section>

      <section id="faq" class="section" aria-labelledby="faq-title">
        <div class="container">
          <h2 id="faq-title" class="section__title" data-i18n="faq.title"></h2>
          <div class="faq__list">
            <details class="faq__item">
              <summary data-i18n="faq.1.q"></summary>
              <p data-i18n="faq.1.a"></p>
            </details>
            <details class="faq__item">
              <summary data-i18n="faq.2.q"></summary>
              <p data-i18n="faq.2.a"></p>
            </details>
            <details class="faq__item">
              <summary data-i18n="faq.3.q"></summary>
              <p data-i18n="faq.3.a"></p>
            </details>
            <details class="faq__item">
              <summary data-i18n="faq.4.q"></summary>
              <p data-i18n="faq.4.a"></p>
            </details>
            <details class="faq__item">
              <summary data-i18n="faq.5.q"></summary>
              <p data-i18n="faq.5.a"></p>
            </details>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer" class="footer">
      <div class="container footer__inner">
        <p class="footer__line" data-i18n="footer.line"></p>
        <!-- TODO: the handles do not exist yet (spec section 9). Until they do, the list is hidden: a
             bordered pill that goes nowhere reads as broken. Then give each link its href and drop
             `hidden`; the copy is already in uz.json and ru.json (footer.social.*). -->
        <ul class="footer__social" role="list" hidden>
          <li><a data-i18n="footer.social.instagram"></a></li>
          <li><a data-i18n="footer.social.telegram"></a></li>
        </ul>
        <p class="footer__note" data-i18n="footer.note"></p>
        <p class="footer__copy" data-i18n="footer.copy"></p>
      </div>
    </footer>

    <div id="sticky-cta" class="sticky-cta" data-visible="false">
      <a class="cta" href="tel:105" data-cta data-i18n="sticky.cta"></a>
      <span class="phone-hint" data-phone-hint hidden></span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
